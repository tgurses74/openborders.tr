# Cloudflare Pages configuration for the openborders-tr project.
# Binds the D1 database (SQLite) and sets non-secret env vars for the
# Functions in /functions. Secrets (RESEND_API_KEY, HUBSPOT_TOKEN) are set
# in the dashboard / via `wrangler pages secret put` — never in this file.

name = "openborders-tr"
compatibility_date = "2026-07-01"
pages_build_output_dir = "."

# ---- Production (main branch → openborders.tr) ----
[vars]
SITE_URL = "https://openborders.tr"

[[d1_databases]]
binding = "DB"
database_name = "openborders-db"
database_id = "7ad10379-0510-4798-8c5d-9dc3998dcfdc"

# ---- Preview (all other branches, e.g. redesign) ----
[env.preview.vars]
SITE_URL = "https://redesign.openborders-tr.pages.dev"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "openborders-db"
database_id = "7ad10379-0510-4798-8c5d-9dc3998dcfdc"
